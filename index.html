<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    
</head>
<body onload="getPokemonStart()">

<nav class="navbar bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" onclick="reload()"><img src="./picture/pokeball.png" alt="Pokeball" class="pokeball"> Pokedex</a>
    <form class="d-flex search" role="search">
      <input class="form-control me-2" type="search" onkeyup="searchPokemon()" placeholder="Search for Pokemon..." aria-label="Search" id="search-input"/>
    </form>
  </div>
</nav>
<div id="pokemon-container" class="pokemon-container"></div>

<div class="load-more">
  <button onclick="loadMorePokemon()" class="button">Load More Pokémon</button>
</div>

<div class="overlay">
<div id="loaded-card"></div>
</div>


<footer class="footer">
    <p>© 2026 Pokedex. All rights reserved.</p> 
</footer>

</body>
</html>
